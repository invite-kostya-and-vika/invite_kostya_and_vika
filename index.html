<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадьба Константина и Виктории</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Caveat:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOy2ufRYNN0R_3KVyJW11pP3USZyOUEcI",
            authDomain: "swadba3390.firebaseapp.com",
            projectId: "swadba3390",
            storageBucket: "swadba3390.firebasestorage.app",
            messagingSenderId: "276046065179",
            appId: "1:276046065179:web:d16965bb0ef978585d52be"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.firebaseDb = db;
        window.firebaseCollection = collection;
        window.firebaseAddDoc = addDoc;
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: #e9e5e4;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.envelope-open {
            overflow: auto;
        }

        /* ===== КОНВЕРТ-ЗАСТАВКА ===== */
        .envelope-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f1ee 0%, #ebe5e0 50%, #f5f1ee 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, transform 0.8s ease;
            overflow: hidden;
        }

        .envelope-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 50vw solid transparent;
            border-right: 50vw solid transparent;
            border-top: 45vh solid rgba(255,255,255,0.3);
            pointer-events: none;
        }

        .envelope-overlay.opened {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .envelope-content {
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 20px;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .envelope-top-text {
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 12px;
        }

        .envelope-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(42px, 10vw, 72px);
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
            line-height: 1;
        }

        .envelope-seal {
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .envelope-seal img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .envelope-bottom-text {
            font-family: 'Manrope', sans-serif;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #555;
            line-height: 1.8;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== SECTION 1: Instagram card ===== */
        .section-1 {
            max-width: 620px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .insta-card {
            background: #e9e5e4;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .insta-header {
            text-align: center;
        }

        .insta-header img {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .insta-date {
            font-family: 'Manrope', sans-serif;
            font-size: 36px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.2;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            padding: 0 16px;
        }

        .couple-names {
            font-family: 'Manrope', sans-serif;
            font-size: 18px;
            color: #1a1a1a;
            line-height: 1.5;
            margin-bottom: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 20px;
        }

        .couple-names .and {
            font-style: italic;
            margin: 0 6px;
        }

        .invite-label {
            font-size: 10.5px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #1a1a1a;
            font-weight: 400;
        }

        .insta-photo {
            margin: 0 16px 16px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            max-height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .insta-photo img {
            width: 50%;
            max-width: 480px;
            height: auto;
            max-height: 420px;
            object-fit: cover;
            object-position: center top;
            display: block;
            margin: 0 auto;
        }

        .kek img {
            width: 70%;
            max-width: 480px;
            height: auto;
            max-height: 420px;
            object-fit: cover;
            object-position: center top;
            display: block;
            margin: 0 auto;
        }

        .insta-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 18px;
        }

        .insta-actions-left {
            display: flex;
            gap: 18px;
        }

        .insta-actions svg {
            width: 24px;
            height: 24px;
            stroke: #1a1a1a;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            cursor: pointer;
            transition: transform 0.2s ease, stroke 0.2s ease;
        }

        .insta-actions svg:hover {
            transform: scale(1.1);
        }

        .insta-actions svg.heart-icon:hover {
            stroke: #e74c3c;
            fill: #e74c3c;
        }

        /* ===== SECTION 2: Greeting + Calendar ===== */
        .section-2 {
            background: url('fon.jpg') center/cover no-repeat;
            padding: 0px 24px 80px;
            text-align: center;
        }

        .music-btn-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .music-btn {
            position: relative;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.05);
        }

        .music-btn.playing .music-circle {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-circle {
            width: 100px;
            height: 100px;
        }

        .music-circle text {
            font-family: 'Manrope', sans-serif;
            font-size: 8px;
            letter-spacing: 1.2px;
            fill: #1a1a1a;
            text-transform: uppercase;
            font-weight: 400;
        }

        .music-circle .play-icon {
            fill: #ffffff;
        }

        .greeting-title {
            font-family: 'Marck Script', cursive;
            font-size: 56px;
            color: #1a1a1a;
            margin-bottom: 28px;
            font-weight: 400;
        }

        .greeting-text {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            max-width: 520px;
            margin: 0 auto 50px;
            font-weight: 300;
        }

        .calendar-card {
            background: #ebe9ea;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
            padding: 28px 24px 32px;
            max-width: 360px;
            margin: 0 auto;
            border: 1px solid #f0f0f0;
        }

        .calendar-month {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px 0;
        }

        .calendar-day-header {
            font-size: 10px;
            font-weight: 500;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 10px;
        }

        .calendar-day {
            font-size: 14px;
            color: #1a1a1a;
            padding: 7px 0;
            font-weight: 400;
            position: relative;
        }

        .calendar-day.other-month {
            color: #ccc;
        }

        .calendar-day.highlight {
            position: relative;
        }

        .calendar-day.highlight .heart-date {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 34px;
            height: 34px;
            z-index: 1;
        }

        .calendar-day.highlight .heart-date svg {
            width: 100%;
            height: 100%;
        }

        .calendar-day.highlight span {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-weight: 500;
            font-size: 12px;
        }

        /* ===== SECTION 3: Venue ===== */
        .section-3 {
            background: url('fon.jpg') center/cover no-repeat;
            padding: 60px 24px 80px;
            text-align: center;
            overflow: hidden;
        }

        .venue-banner {
            max-width: 700px;
            margin: 0 auto 24px;
            overflow: hidden;
        }

        .venue-banner img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
        }

        .details-banner {
            max-width: 600px;
            margin: 0 auto 40px;
            overflow: hidden;
        }

        .details-banner img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
        }

        .venue-title {
            font-family: 'Marck Script', cursive;
            font-size: 56px;
            color: #1a1a1a;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .venue-name {
            font-size: 20px;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .venue-address {
            font-size: 15px;
            color: #555;
            font-weight: 300;
            margin-bottom: 36px;
        }

        .venue-photo {
            max-width: 560px;
            margin: 0 auto 40px;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: #e8e8e8;
        }

        .venue-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .map-btn {
            display: inline-block;
            padding: 18px 44px;
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .map-btn:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        /* ===== SECTION 4: Program of the day ===== */
        .section-4 {
            background: #e9e5e4;
            padding: 20px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .program-card {
            background: #ebe9ea;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            padding: 50px 60px 60px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        .program-card img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        /* ===== SECTION 5: Dress Code ===== */
        .section-5 {
            background: url('fon.jpg') center/cover no-repeat;
            padding: 70px 24px 80px;
            text-align: center;
            overflow: hidden;
        }

        .dresscode-title {
            font-family: 'Marck Script', cursive;
            font-size: 56px;
            color: #1a1a1a;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .dresscode-text {
            font-size: 15px;
            line-height: 1.75;
            color: #444;
            max-width: 420px;
            margin: 0 auto 36px;
            font-weight: 300;
        }

        .color-palette {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .color-swatch {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.25s ease;
            cursor: pointer;
        }

        .color-swatch:hover {
            transform: translateY(-3px) scale(1.08);
        }

        .swatch-twilight   { background: #3E4564; }
        .swatch-bluefog    { background: #97AAB8; }
        .swatch-nimbus     { background: #DCE3E8; }
        .swatch-moonbeam   { background: #EDE8DF; }
        .swatch-potting    { background: #3F2E22; }

        /* ===== SECTION 6: Details ===== */
        .section-6 {
            background: url('fon.jpg') center/cover no-repeat;
            padding: 70px 24px 90px;
            text-align: center;
            overflow: hidden;
        }

        .details-title {
            font-family: 'Marck Script', cursive;
            font-size: 56px;
            color: #1a1a1a;
            margin-bottom: 50px;
            font-weight: 400;
        }

        .detail-item {
            max-width: 520px;
            margin: 0 auto 50px;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-number {
            font-family: 'Marck Script', cursive;
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .detail-text {
            font-size: 15px;
            line-height: 1.8;
            color: #333;
            font-weight: 300;
        }

        /* ===== SECTION 7: RSVP Form ===== */
        .section-7 {
            background: url('fon.jpg') center/cover no-repeat;
            padding: 70px 24px 90px;
            text-align: center;
            overflow: hidden;
        }

        .rsvp-title {
            font-family: 'Great Vibes', cursive;
            font-size: 64px;
            color: #1a1a1a;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .rsvp-deadline {
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #1a1a1a;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .rsvp-form {
            max-width: 480px;
            margin: 0 auto;
            text-align: left;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-size: 15px;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            background: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-input::placeholder {
            color: #999;
        }

        .form-input:focus {
            border-color: #555;
            box-shadow: 0 0 0 2px rgba(26, 26, 26, 0.08);
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-circle {
            width: 20px;
            height: 20px;
            border: 1.5px solid #1a1a1a;
            border-radius: 50%;
            margin-right: 12px;
            position: relative;
            flex-shrink: 0;
            transition: border-color 0.25s ease;
        }

        .radio-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 10px;
            height: 10px;
            background: #1a1a1a;
            border-radius: 50%;
            transition: transform 0.25s ease;
        }

        .radio-option input[type="radio"]:checked + .radio-circle {
            border-color: #1a1a1a;
        }

        .radio-option input[type="radio"]:checked + .radio-circle::after {
            transform: translate(-50%, -50%) scale(1);
        }

        .radio-label-text {
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 400;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-option input[type="checkbox"] {
            display: none;
        }

        .checkbox-square {
            width: 20px;
            height: 20px;
            border: 1.5px solid #1a1a1a;
            border-radius: 2px;
            margin-right: 12px;
            position: relative;
            flex-shrink: 0;
            transition: all 0.25s ease;
            background: #ffffff;
        }

        .checkbox-square::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 6px;
            width: 5px;
            height: 10px;
            border: solid #1a1a1a;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) scale(0);
            transition: transform 0.2s ease;
        }

        .checkbox-option input[type="checkbox"]:checked + .checkbox-square {
            background: #1a1a1a;
        }

        .checkbox-option input[type="checkbox"]:checked + .checkbox-square::after {
            border-color: #ffffff;
            transform: rotate(45deg) scale(1);
        }

        .checkbox-label-text {
            font-size: 14px;
            color: #1a1a1a;
            font-weight: 400;
        }

        .submit-btn-wrap {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            display: inline-block;
            padding: 18px 56px;
            background: #555555;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #333333;
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: #888;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== SECTION 8: Countdown ===== */
        .section-8 {
            background: url('fon.jpg') center/cover no-repeat;
            padding: 80px 24px 100px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .countdown-header {
            font-family: 'Caveat', cursive;
            font-size: 72px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 24px;
            line-height: 1.1;
        }

        .countdown-subtitle {
            font-family: 'Caveat', cursive;
            font-size: 48px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 40px;
            line-height: 1.2;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .countdown-item {
            text-align: center;
        }

        .countdown-number {
            font-family: 'Manrope', sans-serif;
            font-size: 56px;
            font-weight: 500;
            color: #1a1a1a;
            line-height: 1;
            margin-bottom: 8px;
        }

        .countdown-label {
            font-family: 'Manrope', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: #888;
        }

        @media (max-width: 500px) {
            .section-1 { max-width: 100%; }
            .insta-date { font-size: 28px; }
            .couple-names { font-size: 15px; padding: 0 12px; }
            .insta-photo { max-height: 300px; }
            .insta-photo img { max-height: 300px; }
            .greeting-title, .venue-title, .dresscode-title, .details-title { font-size: 42px; }
            .greeting-text, .dresscode-text, .detail-text { font-size: 14px; }
            .section-2, .section-3, .section-5, .section-6, .section-7, .section-8 { padding: 20px 20px 50px; }
            .venue-photo { max-width: 100%; }
            .program-card { padding: 30px 20px 40px; }
            .color-swatch { width: 38px; height: 38px; }
            .detail-number { font-size: 26px; }
            .countdown-header { font-size: 52px; margin-bottom: 16px; }
            .countdown-subtitle { font-size: 36px; margin-bottom: 28px; }
            .countdown-number { font-size: 42px; }
            .countdown-label { font-size: 14px; }
            .countdown-timer { gap: 24px; }
            .rsvp-title { font-size: 48px; }
            .rsvp-deadline { font-size: 13px; letter-spacing: 1px; }
            .submit-btn { padding: 16px 44px; font-size: 13px; }

            .venue-banner {
                max-width: 100%;
                width: 100%;
                margin: 0 0 24px 0;
                overflow: hidden;
            }

            .venue-banner img {
                width: 100%;

            </div>

<script>
    let isPlaying = false;
    const audioPlayer = document.getElementById('audioPlayer');
    const envelopeOverlay = document.getElementById('envelopeOverlay');

    // Блокируем прокрутку пока конверт открыт
    document.body.style.overflow = 'hidden';

    // Открытие конверта + запуск музыки
    envelopeOverlay.addEventListener('click', function() {
        if (this.classList.contains('opened')) return;
        
        this.classList.add('opened');
        
        // Запускаем музыку
        audioPlayer.play().catch(error => {
            console.error('Ошибка воспроизведения:', error);
        });
        isPlaying = true;
        
        // Обновляем кнопку музыки (показываем что играет)
        const musicBtn = document.getElementById('musicBtn');
        if (musicBtn) musicBtn.classList.add('playing');
        
        // Разблокируем прокрутку и убираем оверлей
        setTimeout(() => {
            this.style.display = 'none';
            document.body.classList.add('envelope-open');
            document.body.style.overflow = '';
        }, 800);
    });

    function toggleMusic() {
        const btn = document.getElementById('musicBtn');
        
        if (isPlaying) {
            audioPlayer.pause();
            btn.classList.remove('playing');
        } else {
            audioPlayer.play().catch(error => {
                console.error('Ошибка воспроизведения:', error);
            });
            btn.classList.add('playing');
        }
        
        isPlaying = !isPlaying;
    }

    async function submitForm(e) {
        e.preventDefault();
        const btn = document.querySelector('.submit-btn');
        const originalText = btn.textContent;

        btn.textContent = 'Отправка...';
        btn.disabled = true;
        btn.style.background = '#888';

        const formData = new FormData(e.target);
        const data = {
            name: formData.get('guestName'),
            partner: formData.get('guestPartner') || 'Нет',
            attendance: formData.get('attendance'),
            drinks: formData.getAll('drinks').join(', ') || 'Не указано',
            submittedAt: new Date().toLocaleString('ru-RU')
        };

        try {
            const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    access_key: "e566664f-744e-428a-96b0-29c3d3c3d20a",
                    subject: `Новая анкета: ${data.name}`,
                    from_name: "Свадебный сайт Константин & Виктория",
                    name: data.name,
                    email: "vikayandex74@gmail.com",
                    message: `Имя: ${data.name}\nС парой: ${data.partner}\nПрисутствие: ${data.attendance === 'yes' ? 'Да, приду' : 'Нет, не смогу'}\nНапитки: ${data.drinks}\nДата отправки: ${data.submittedAt}`
                })
            });

            const result = await response.json();

            if (result.success) {
                btn.textContent = 'Отправлено ✓';
                btn.style.background = '#4CAF50';
                btn.disabled = false;

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#555555';
                    e.target.reset();
                }, 3000);
            } else {
                throw new Error('Web3Forms вернул ошибку: ' + result.message);
            }

        } catch (error) {
            console.error('Ошибка:', error);
            alert('Ошибка: ' + error.message);
            btn.textContent = originalText;
            btn.style.background = '#555555';
            btn.disabled = false;
        }
    }

    function updateCountdown() {
        const weddingDate = new Date('2027-07-18T00:00:00');
        const now = new Date();
        const diff = weddingDate - now;

        if (diff <= 0) {
            document.getElementById('days').textContent = '0';
            document.getElementById('hours').textContent = '0';
            document.getElementById('minutes').textContent = '0';
            document.getElementById('seconds').textContent = '0';
            return;
        }

        document.getElementById('days').textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('hours').textContent = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById('minutes').textContent = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById('seconds').textContent = Math.floor((diff % (1000 * 60)) / 1000);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
